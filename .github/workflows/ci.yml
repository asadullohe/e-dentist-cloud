# Test va tekshiruvlar. Har push va pull request da ishlaydi.
#
# Testlar haqiqiy Postgres, Redis va Garage ga ulanadi — koʻp ijarachilik
# himoyasi RLS ga tayanadi, uni soxta baza bilan sinab boʻlmaydi.
# Shuning uchun lokaldagi oʻsha `docker compose` ishlatiladi: CI va
# notebook bir xil muhitni koʻtaradi.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Deploy ish oqimi shu testlarni qayta ishlatadi
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: edentist
      POSTGRES_PASSWORD: ci-parol
      POSTGRES_DB: edentist
      POSTGRES_PORT: 5433
      APP_DB_USER: edentist_app
      APP_DB_PASSWORD: ci-app-parol
      REDIS_PORT: 6379
      # Garage (S3): kalitlar shakli GK+24 hex / 64 hex — garage-init import qiladi
      GARAGE_RPC_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_CAPACITY: 5G
      S3_PORT: 9000

      TZ: Asia/Tashkent
      NODE_ENV: test
      DATABASE_URL: postgresql://edentist:ci-parol@localhost:5433/edentist
      APP_DATABASE_URL: postgresql://edentist_app:ci-app-parol@localhost:5433/edentist
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-sessiya-kaliti-uzun-satr
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: garage
      S3_ACCESS_KEY: GKc1c1c1c1c1c1c1c1c1c1c1c1
      S3_SECRET_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
      S3_BUCKET: edentist-test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bogʻliqliklar
        run: npm ci

      # Bir xil commit uchun CI va Deploy parallel yuradi — ikkalasi Docker Hub
      # dan rasm tortadi; ulushli IP dagi pull chegarasi yoki Garage sogʻliq
      # tekshiruvi vaqti-vaqti bilan tasodifan yiqiladi (21/09/2026). Uch urinish
      - name: Muhit konteynerlari
        run: |
          for attempt in 1 2 3; do
            docker compose up -d --wait && exit 0
            echo "::warning::konteynerlar koʻtarilmadi ($attempt-urinish)"
            docker compose logs --tail 30
            docker compose down --remove-orphans
            sleep 20
          done
          exit 1

      - name: Migratsiya
        run: npm run db:migrate:deploy

      - name: Format va lint
        run: npm run ci

      - name: Tiplarni tekshirish
        run: npm run typecheck

      - name: Testlar
        run: npm test

      - name: Xato boʻlsa loglar
        if: failure()
        run: docker compose logs --tail 50
