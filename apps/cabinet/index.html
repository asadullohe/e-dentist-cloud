<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Dentist</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Tema — birinchi boʻyoqdan oldin. React effektini kutilsa qorongʻi
      // rejimdagi foydalanuvchi bir lahza oq ekran koʻradi.
      // Kalit va mantiq shared/lib/theme.ts bilan bir xil
      try {
        const saved = localStorage.getItem('edentist-cabinet-theme')
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {
        // maxfiy oyna — tema keyin React dan keladi
      }
    </script>
    <style>
      /* Yuklanish ekrani — HTML kelishi bilan koʻrinadi, JS ni kutmaydi.
         React chizilgach shared/ui/splash.tsx uni yopadi. Ranglar
         app/styles/index.css tokenlari bilan bir xil (u hali yuklanmagan) */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(1 0 0);
        color: oklch(0.129 0.042 264.695);
        font-family: "Inter Variable", Inter, system-ui, sans-serif;
        --splash-primary: oklch(0.55 0.2 255);
        --splash-shadow: oklch(0.129 0.042 264.695 / 18%);
      }
      html.dark #splash {
        background: oklch(0.129 0.042 264.695);
        color: oklch(0.984 0.003 247.858);
        --splash-primary: oklch(0.72 0.16 250);
        --splash-shadow: oklch(1 0 0 / 22%);
      }
      #splash[hidden] {
        display: none;
      }
      #splash .box {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #splash svg {
        width: 56px;
        height: 56px;
        color: var(--splash-primary);
        animation: splash-float 2.6s ease-in-out infinite;
      }
      /* Soya — chetlari xira ellips, tekis chiziq emas: tish koʻtarilganda
         torayadi va xiralashadi */
      #splash .shadow {
        width: 48px;
        height: 10px;
        margin-top: 4px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, var(--splash-shadow) 0%, transparent 70%);
        animation: splash-shadow 2.6s ease-in-out infinite;
      }
      #splash .name {
        margin-top: 14px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      #splash .dots {
        display: flex;
        gap: 6px;
        margin-top: 14px;
      }
      #splash .dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--splash-primary);
        animation: splash-dot 1.3s ease-in-out infinite;
      }
      #splash .dots span:nth-child(2) {
        animation-delay: 180ms;
      }
      #splash .dots span:nth-child(3) {
        animation-delay: 360ms;
      }
      @keyframes splash-float {
        50% {
          transform: translateY(-7px);
        }
      }
      @keyframes splash-shadow {
        50% {
          transform: scale(0.72, 0.8);
          opacity: 0.45;
        }
      }
      @keyframes splash-dot {
        0%,
        70%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        35% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Yuklanmoqda">
      <div class="box">
        <!-- Tish — Tabler Icons «dental» (MIT) -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M12 5.5c-1.074-.586-2.583-1.5-4-1.5-2.1 0-4 1.247-4 5 0 4.899 1.056 8.41 2.671 10.537.573.756 1.97.521 2.4-.327l1.06-2.086a1.05 1.05 0 0 1 1.738 0l1.06 2.086c.43.848 1.827 1.083 2.4.327 1.615-2.127 2.671-5.638 2.671-10.537 0-3.753-1.9-5-4-5-1.417 0-2.926.914-4 1.5z"
          />
          <path d="M12 5.5l3 1.5" />
        </svg>
        <div class="shadow"></div>
        <div class="name">E-Dentist</div>
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
