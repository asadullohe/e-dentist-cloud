# Lokal ishlab chiqish muhiti.
# Serverdagi (Hetzner) tuzilma alohida faylda boʻladi — bosqich 5.10.
#
#   docker compose up -d      koʻtarish
#   docker compose ps         holatini koʻrish
#   docker compose down       toʻxtatish (maʼlumot saqlanadi)
#   docker compose down -v    toʻxtatish va MAʼLUMOTNI OʻCHIRISH

name: e-dentist

services:
  postgres:
    image: postgres:16-alpine
    container_name: ed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Oʻzbekcha matn toʻgʻri saralanishi uchun
      LANG: C.UTF-8
      # Ishga tushirish roli init skriptida yaratiladi — docker/postgres/init
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Birinchi koʻtarilishda boʻsh diskda initdb va init skripti
      # yuradi — 4 GB serverda bu 60 soniyadan oshdi va sanoq oʻsha
      # paytda tugab, migrate bilan api ishga tushmay qolgan edi
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: ed-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: ed-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"          # S3 API
      - "${MINIO_CONSOLE_PORT}:9001"  # brauzerdagi konsol
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  miniodata:
