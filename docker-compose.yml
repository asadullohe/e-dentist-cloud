# Lokal ishlab chiqish muhiti.
# Serverdagi (Hetzner) tuzilma alohida faylda boʻladi — bosqich 5.10.
#
#   docker compose up -d      koʻtarish
#   docker compose ps         holatini koʻrish
#   docker compose down       toʻxtatish (maʼlumot saqlanadi)
#   docker compose down -v    toʻxtatish va MAʼLUMOTNI OʻCHIRISH

name: e-dentist

services:
  postgres:
    image: postgres:16-alpine
    container_name: ed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Oʻzbekcha matn toʻgʻri saralanishi uchun
      LANG: C.UTF-8
      # Ishga tushirish roli init skriptida yaratiladi — docker/postgres/init
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Birinchi koʻtarilishda initdb va init skripti yuradi — sogʻliq
      # sanogʻi oʻsha paytda ketmasin. Sekin diskda bu bir necha oʻn soniya
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: ed-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  garage:
    # S3-mos fayl ombori (MinIO oʻrniga — reja 8-bosqich). Teg qotirilgan:
    # yangilash — ongli qaror, init.sh ham oʻsha nashr bilan sinalgan
    image: dxflrs/garage:v2.4.1
    container_name: ed-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    ports:
      - "${S3_PORT:-9000}:3900"   # S3 API
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      # Tugunga rol berilguncha (garage-init) klaster «sogʻlom» emas —
      # `up --wait` aynan shuni kutadi
      test: ["CMD", "/garage", "health", "-q"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  # Bir martalik sozlash: rol, kalit, bucket. Ikkinchi ishga tushirishda
  # hech narsa qilmaydi. Rasmi lokal quriladi (docker/garage/Dockerfile)
  garage-init:
    build: docker/garage
    container_name: ed-garage-init
    restart: "no"
    depends_on:
      garage:
        condition: service_started
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-50G}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta:ro

volumes:
  pgdata:
  garagemeta:
  garagedata:
